# Default configuration for TimesNet smell classification
# Command-line arguments will override these values

# Mode: "train" or "eval"
mode: train

# Data configuration
data_root: smell_ts_dataset/SmellNet
classes:
  # all
  - banana
  - apple
  - mango
  - mandarin_orange
  - asparagus
  # Alternative class selection options:
  # classes: all  # Auto-discover all available classes
  # classes: 30   # Randomly select 30 classes
features: [NO2, VOC, CO, C2H5OH, Alcohol, LPG]  # null means use all numeric columns, or specify: [NO2, VOC, CO, ...]
seq_len: 512
batch_size: 2
train_split: 0.8   # Proportion for training set (can be 0 to omit)
val_split: 0    # Proportion for validation set (can be 0 to omit)
test_split: 0.20   # Proportion for test set (can be 0 to omit)
num_workers: 0
normalization: zscore  # zscore, minmax, or none
seed: 42

# Training configuration
epochs: 15
learning_rate: 0.001
weight_decay: 0.00001
grad_clip: 3.0
log_interval: 10
mixed_precision: false

# Validation control
val_frequency: 1  # Validate every N epochs

# Checkpoint control
save_frequency: 1  # Save checkpoint every N epochs
save_best_only: true  # If true, only keep the best checkpoint
keep_best_k: 3  # Number of best checkpoints to keep (if save_best_only is false)

# WandB logging
use_wandb: true
wandb_project: smell-net
wandb_entity: null
wandb_run_name: null
wandb_tags: []

# Model configuration
dropout: 0.001
d_model: 64
d_ff: 128
layers: 2
top_k: 5
num_kernels: 6

# Paths
save_dir: /home/keaneong/SmellNet/ts_classification/ckpts
checkpoint: null  # Path to checkpoint for eval mode
metadata: null    # Path to metadata JSON from training

